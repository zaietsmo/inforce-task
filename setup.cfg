[flake8]
# Line length - PEP 8 officially recommends 79, but 88-100 is common in modern projects
max-line-length = 88

# Exclude directories and files
exclude = 
    .git,
    __pycache__,
    */migrations/*,
    venv,
    .venv,
    env,
    .env,
    build,
    dist

# Ignore specific errors/warnings
ignore = 
    # These are recommended when using Black formatter
    E203,  # Whitespace before ':'
    W503,  # Line break before binary operator
    E231,  # Missing whitespace after ','

# McCabe complexity threshold
max-complexity = 10

# Specify more violations as errors rather than warnings
select = C,E,F,W,B,B950



# Statistics settings
statistics = True
count = True

# Per-file ignore patterns
per-file-ignores =
    # Allow unused imports in __init__.py
    __init__.py: F401
    # Ignore long lines in settings.py
    */settings.py: E501

# Docstring style checking
docstring-convention = google 